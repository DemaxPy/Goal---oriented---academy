<!DOCTYPE html>
<html>
<head>
    <title>Audio and Video Website</title>
</head>
<body>

    <h1>My Media Website</h1>

    <h2>Audio</h2>
    <audio controls>
        <source src="Jeopardy Theme.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <h2>Video</h2>
    <video width="500" controls>
        <source src="This Video is a Drawing App - SWEet (1080p, h264).mp4" type="video/mp4">
        Your browser does not support the video element.
    </video>



    <!-- audio controls: საშუალებას გვაძლევს რომ დაამატოს ღილაკები და ფუნქციები აუდიოზე.-->
    <!-- video controls: საშუალებას გვაძლევს რომ დაამატოს ღილაკები და ფუნქციები ვიდეოზე -->
    <!-- src=: ეს კოდი გვეუბნევა რომ სად არის კოდი შენახული -->



    <!-- header არის საიტის მთავარი გვერდის ზედა ნაწილი (გვერდის დასაწყისი)-->
    <!-- main არის საიტის მთავარი გვერდი-->
    <!-- footer არის საიტის ქვედა ნაწილი (გვერდის დასასრული)-->
</body>
</html>
